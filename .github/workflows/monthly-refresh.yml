name: Monthly price refresh

# Re-reads every provider pricing page on the 1st of each month and opens a pull request
# with the new edition. Nothing is pushed to main: a maintainer reviews the changed and
# unreadable rows listed in the pull request body before merging.

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      edition:
        description: "Edition to write, YYYY_MM (default: current month)"
        required: false
        default: ""

permissions: {}

concurrency:
  group: monthly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run offline tests
        run: python3 -m unittest discover -s tests

      - name: Read provider pages and write the new edition
        id: refresh
        env:
          EDITION_INPUT: ${{ inputs.edition }}
        run: |
          edition="${EDITION_INPUT:-$(date -u +%Y_%m)}"
          if ! [[ "$edition" =~ ^[0-9]{4}_(0[1-9]|1[0-2])$ ]]; then
            echo "::error::invalid edition '$edition', expected YYYY_MM"
            exit 1
          fi
          python3 scripts/refresh.py --write --edition "$edition" --report "$RUNNER_TEMP/report.md"
          echo "edition=$edition" >> "$GITHUB_OUTPUT"

      - name: Check every edition
        run: python3 scripts/check.py

      - name: Open the pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: refresh/${{ steps.refresh.outputs.edition }}
          base: main
          add-paths: data/*_${{ steps.refresh.outputs.edition }}.*
          commit-message: Add GPU rental price edition ${{ steps.refresh.outputs.edition }}
          title: GPU rental price edition ${{ steps.refresh.outputs.edition }}
          body-path: ${{ runner.temp }}/report.md
          labels: price-refresh
          delete-branch: true
